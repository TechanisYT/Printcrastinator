[project]
name = "printcrastinator"
version = "0.1.0"
description = "Prints your Nextcloud tasks and calendar as a daily thermal receipt."
readme = "README.md"
authors = [
    { name = "Techanis" }
]
requires-python = ">=3.13"
dependencies = [
    "python-escpos>=3.1",
    "caldav>=1.4",
    "icalendar>=6.0",
    "httpx>=0.27",
    "nicegui>=2.10",
    "rich>=13",
    "dbus-next>=0.2.3",
    "tomli-w>=1.0",
    "python-dateutil>=2.9",
    "textual>=8.2.8",
    "mcp>=2.2.0",
    "recurring-ical-events>=3.8.2",
    "keyring>=25.7.0",
    "cryptography>=50.0.1",
]

[project.scripts]
printcrastinator = "printcrastinator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
